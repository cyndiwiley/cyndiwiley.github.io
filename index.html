const VTEXT = {"w-mp": {"kind": "Transcript", "html": "<p class=\"tnote\">The game opens on its title screen, which has a volume slider and buttons for How to Play and Play. Flapjack the monkey stands in a hallway with three closed doors, and a thought bubble shows the sibling he wants to visit next and the piece of clothing he hopes to find. Each door has a picture of the sibling whose room is behind it. When Flapjack asks the player to choose, a button for each choice appears on screen. The game ends on the title screen, now with buttons for Go to Next Level and Print Certificate.</p><p class=\"tnote\">[Music]</p><p><strong>Flapjack:</strong> Hi, I’m Flapjack. Can you help me get ready for school? I can’t find my clothes. I wonder if my sister Flo knows where my shoes are. Ah, her door is shut. What should I do? Should I knock on the door? Good idea! I’ll knock and ask if I can go in. Knock, knock. Flo, may I come in, please?</p><p><strong>Flo:</strong> Why, sure, Flapjack. Thank you for asking. Come on in.</p><p><strong>Flapjack:</strong> Oh, there’s my shoes. Can you help me get them? Good job. Thanks for helping me find my shoes. Now I need to go to Bo’s room and see if he has my pants. Oh, Bo’s door is shut too. Hmm, what should I do? Should I knock on the door? Should I just go in? Help me choose. Oh, good idea. I’ll knock and ask if I can go in. Knock, knock. Bo, may I come in, please?</p><p><strong>Bo:</strong> Well, Flapjack, yes, you may come in.</p><p><strong>Flapjack:</strong> Hey, there’s my pants. Can you help me get them? Great, thanks. Now I just need to find my shirt. I think I know where to look. I’ll check in Jo’s room. Oh, Jo’s door is shut too. What should I do? Should I knock on the door? Should I just go in? Should I yell? Help me choose. Hey, good idea. I’ll knock and ask if I can go in. Knock, knock. Jo, may I come in, please?</p><p><strong>Jo:</strong> Oh, sure, Flapjack. Come on in.</p><p><strong>Flapjack:</strong> Hey, there’s my shirt. Can you help me get it? Now I have my shirt, my pants and my shoes. Now I can get dressed for school. But first, let’s dance!</p><p class=\"tnote\">[Music]</p>"}, "w-bff": {"kind": "Transcript", "html": "<p class=\"tnote\">The video opens on a community television logo and a title card in a retro teletext style that reads Art + Design = BFFs. Rachel Merrill, labeled Art, and Cyndi Wiley, labeled Design, introduce themselves while riding in a car. On-screen text describes Rachel as an artist who works in sculpture, installation, photography and video. Cyndi is described as an interaction designer, creative coder, artist, casual gamer and educator who likes cats. For the rest of the talk the two appear side by side on webcam video, and pixel hearts, clouds and drawn scribbles animate over them. The video ends with closing titles about the two presenters.</p><p>Art + Design = BFFs, Best Friends Forever, or Queering the Pedagogical Framework for Interdisciplinarity between Art and Design.</p><p><strong>Art (Rachel Merrill):</strong> So my name is Art.</p><p><strong>Design (Cyndi Wiley):</strong> And my name is Design.</p><p>And together we’re BFFs. We’re here to dispel the myth that art and design can’t be close friends, that they should remain separate as two different ways of thinking. You can comment on this discussion by using the hashtag #downwithsilos. How are BFFs relevant to teaching art and design? A colloquial term in the United States for women who are very close friends is BFF. BFF is an acronym meaning best friends forever and is characterized typically by teenage girls and young women in junior and senior high school relationships.</p><p>As the term BFF has been appropriated into popular culture and is now used by varying ages and genders, we are further appropriating the term to queer conventional art and design pedagogy. This pedagogical framework provides an innovative melding of traditional disciplines, encouraging experimentation by students from constant and consistent exposure to differing viewpoints and critical lenses within the classroom dichotomy.</p><p>The collaborative approach provides interdisciplinarity between art and design that segues contemporary art and design practices. The pedagogical framework provides divergent ideological basis for design and art faculty to work together throughout a student’s full course of undergraduate study by team teaching, sharing technological resources, jointly critiquing and collectively evaluating student outcomes. This type of interdisciplinary approach is unique within art and design, as they are often conflated but segregated into separate courses in reality after the first-year foundations curriculum.</p><p>The first myth is that graphic design has nothing to do with art. Art and graphic design have similar intentions. Until recently, design was vastly accepted as utilitarian and pragmatic, devoid of emotional content. I don’t agree with this attempt at removal of emotional connections with an audience. It’s counterintuitive to what we call branding and now user experience, or my preferred term, human-centered design. Branding is building a relationship with an audience, the individuals that form an emotional bond to a certain product or service.</p><p>Although with branding, there is explicit intent to sell a product or service. With human-centered design, there is much involvement with the end use of an artifact. This is an opening to incorporate an artistic expression as well as design for social justice. The second myth is that art has nothing to do with design because it is too personal. It is viewed through the lens that art is only a personal expression of one’s self and directly linked to the individual making the work.</p><p>The work swings between becoming overly emotional or non-emotional, either way devoid of deeper, richer motivations and interests, be it cathartic or aesthetic value, or art for art’s sake. Choosing to only look at art-making as primarily, if not the sole, part of the artist’s practice limits the artist to produce watered-down work, and divorcing personal work from more universal ideas of design limits the work to insularity viewpoints within limited viewing potential.</p><p class=\"tnote\">[Closing titles]</p>"}, "t-informatic": {"kind": "Transcript", "html": "<p class=\"tnote\">The student narrates the video. Flat shapes in yellow, orange and blue illustrate each point, and labels such as func and non func mark the two kinds of animation. A .js tag stands for JavaScript and an AE tile for After Effects. The video ends on a list of its sources.</p><p>There are many capable animation tools available today, ranging from JavaScript libraries like p5.js to full-blown animation and video programs like After Effects. With all of these options, how do you know which ones are best for a particular project? That’s what this presentation is going to answer. I will look at each type of animation that the company wants to produce and give a recommendation for each while explaining the reasoning behind it.</p><p>But first, I need to explain functional and non-functional animation. Basically, an animation that is solely decoration is non-functional, and an animation that is part of an interactive element is functional. For example, a promotional video would be non-functional animation, but a button changing color when hovered over would be functional animation. It’s giving feedback to the user. Websites are generally built with JavaScript as the programming language.</p><p>JavaScript itself has the ability to animate web page elements, but this could be extended by the use of libraries, JavaScript files that provide new functionality to a web page. An example would be p5.js. It’s a JavaScript library whose aim is to add drawing and sketching functions to JavaScript with simple syntax. It’s a good tool, but I’d recommend GreenSock for the company’s website. GreenSock is a collection of JavaScript libraries that adds all kinds of tools</p><p>to animate web page elements. Tweens, playback controls and even simulated physics are possible with GreenSock. Given that web pages use a lot of functional animation and that GreenSock will tightly integrate with JavaScript, it makes sense to use it to animate a website. The wide variety of tools available will make nearly any idea possible, and the developers won’t have to learn a new language or program. I’d recommend GreenSock for banner ads,</p><p>HTML greetings and interactive quizzes as well for the same reasons. Quizzes are especially well suited for GreenSock, as it provides a large number of possibilities for adding functional animations to a quiz. Again, the tight integration with JavaScript is a very nice feature. If 3D graphics are desired, WebGL would be a good option to pursue, as it provides the ability to have 3D graphics in a web page natively, but if you aren’t using 3D graphics, there isn’t much reason for it.</p><p>For promotional videos, however, I’d recommend After Effects. It’s a very robust animation application capable of executing complex ideas and effects, and it exports video only. After Effects can import many types of assets, so it can be adapted to many workflows. It can even use 3D graphics via Cinema 4D technology. To use these videos on the web, simply convert the rendered footage to a suitable file type such as MP4 and</p><p>upload it to YouTube or embed it with HTML. So, I’ve briefly introduced several animation tools and recommended which ones to use for different projects. My sources are on the screen. If you want to watch this video again, simply click the replay button at the end. Thank you for watching.</p>"}, "w-mo": {"kind": "Video description", "html": "<p>A screen recording of the <cite>MO</cite> app on an iPad, with no spoken words. The recording starts at the cover of the app and moves through an introduction page into a story. Video and artwork from the story play on the screen while a hand taps the controls. The recording ends on a page of text about the artist.</p>"}, "isu-kiosk-video": {"kind": "Video description", "html": "<p>Silent footage of the Iowa State University Extension and Outreach booth at a trade show. The camera moves past the iPad kiosk on its floor stand, which shows the red title screen of the app. Banners for Extension and Outreach hang behind the kiosk, next to a large map marked in red.</p>"}, "isu-anim-titles": {"kind": "Video description", "html": "<p>Silent kinetic type in white over archival photographs in a red duotone. The words build one phrase at a time: “Iowa’s first settlers saw farming as a profession worthy of science and education. Their stories are at the heart of our land grant legacy.” The key words in each phrase appear in large bold capitals, framed by thin white rules.</p>"}, "w-gdb": {"kind": "Video description", "html": "<p>Kinetic typography for the poem “Gentle Doctor Brown.” Words of the poem scale and rotate across white, gray, red and yellow grounds, set in brown, black and yellow type. Some words are struck through and replaced as the poem goes on. Music plays throughout, and there are no spoken words.</p>"}, "w-farm": {"kind": "Video description", "html": "<p>A hand-drawn farm scene in black line on pale yellow. A tractor drives toward a farmhouse and a barn with a chicken on its roof. Dark clouds gather, and a tornado lifts the tractor into the air. At the end, the chicken is left with ruffled feathers. The animation has sound but no spoken words.</p>"}, "w-crypt": {"kind": "Video description", "html": "<p>A television promo for <cite>Tales from the Crypt</cite>. The title, in stone-textured letters, flies through a tunnel of light into a cemetery, where a dark 3D form made of joined spheres moves between the gravestones. The airtime appears in the same stone letters, and the promo ends on the network’s logo. It has sound but no spoken words.</p>"}, "w-guava": {"kind": "Video description", "html": "<p>Silent screen recording of the interactive poem. The text of “She Tasted Like Guava” fills a white screen in small type. As the reader moves the mouse, the words break apart into a field of thin vertical strokes topped with purple dots, then return to the poem.</p>"}, "t-alt-app": {"kind": "Video description", "html": "<p>Silent screen recording of the <cite>ALT</cite> magazine app on an iPad. A hand scrolls through the special thanks page and the contents page, then opens an interview story. A video interview with two people at a table plays inside the app.</p>"}, "t-dmw": {"kind": "Video description", "html": "<p>Animated type in gray on a dark ground. The words “17 minutes” blur and grow across the screen, then the phrase “17 goddamn minutes” forms and breaks apart into a scribbled texture. It has sound but no spoken words.</p>"}, "t-tvpromo": {"kind": "Video description", "html": "<p>Large blue 3D letters spelling ID tilt into view against a gray wall. A dark red stream of small beads pours over them from above. It has sound but no spoken words.</p>"}, "t-morph": {"kind": "Video description", "html": "<p>The camera moves through a dim 3D room, past a wall clock, toward a framed picture of a cartoon tiger cub. The tiger leaves the picture, which turns into a gray scribble, and lands below the frame. The video ends on the words “challenge your imagination” over an orange paw print. It has sound but no spoken words.</p>"}, "t-sting": {"kind": "Video description", "html": "<p>Silent black and white footage of the Grand View University campus at night, with snow on the ground. The camera moves toward a lit campus building while the words Grand View University stay framed in the center of the screen.</p>"}, "t-sting2": {"kind": "Video description", "html": "<p>Silent footage of a student with a backpack who walks across the Grand View campus at sunset and down a hallway lined with student artwork. The student then rides a scooter past the Grand View University sign.</p>"}, "t-bubblebear": {"kind": "Video description", "html": "<p>The words Bubble Bear, Iced Champagne fade in on white. A polar bear shape fills with a mountain landscape, then settles into a solid blue bear above the name. It has sound but no spoken words.</p>"}, "t-campfire": {"kind": "Video description", "html": "<p>Silent animation in flat colors. A yellow car drives along a river through a valley with a deer, an owl, a tent and a campfire. A toasted marshmallow on a stick then appears with the lines “You’ve traveled far for a good time. Don’t forget the best part.” The spot ends on the Campfire Marshmallows logo.</p>"}};

    ${p.siderows ? srText(p) : `<div class="proj-text"><span class="label kind">${esc(p.kind)}</span><h3>${esc(p.title)}</h3><div class="desc">${p.desc.map(d => `<p>${rich(d)}</p>`).join("")}</div>${p.code ? `<figure class="codefig"><figcaption class="label">sketch.js</figcaption><pre><code>${esc(p.code)}</code></pre></figure>` : ""}${p.credit ? `<p class="credit">${rich(p.credit)}</p>` : ""}${p.links ? p.links.map(([t, u]) => `<a class="linkout" href="${u}" target="_blank" rel="noopener">${esc(t)}<span class="vh"> (opens in a new tab)</span></a>`).join("") : ""}${p.side ? sideFig(p) : ""}${p.caseLink ? `<a class="linkout" href="#case-${p.caseLink}" style="margin-top:14px">Read the case study</a>` : ""}</div>`}${p.loops ? loopSet(p.loops, 4) : ""}
  </article>`;
}

function viewSection(s) {

  ${s.stance ? stanceBlock(s.stance) : ""}

      ${g.methods ? `<div class="methods">${g.methods.map(m => `<div class="mcat"><h3>${esc(m.h)}</h3><p class="label">${esc(m.sub)}</p><ul>${m.items.map(([t, d]) => `<li><strong>${esc(t)}</strong> ${esc(d)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}
      ${g.projects ? g.projects.map(projBlock).join("") : grid(g.ids, { title: g.title })}

  ${pager(prev && { href: prev.id, name: prev.name }, next ? { href: next.id, name: next.name } : { href: "about", name: "About" })}`;

      ${x.still ? `<div class="still">${grid([x.still], { title: c.title, eager: si === 0 })}</div>` : ""}<div class="txt measure">${(x.p || []).map(p => `<p>${rich(p)}</p>`).join("")}${x.list ? `<${x.h === "Publications" ? "ul" : "ol"}>${x.list.map(l => `<li>${esc(l)}</li>`).join("")}</${x.h === "Publications" ? "ul" : "ol"}>` : ""}</div>

$("#app").addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (!t) return;
  cur = { g: t.dataset.g, i: +t.dataset.i }; show();
  if (typeof lb.showModal === "function") lb.showModal(); else lb.setAttribute("open", "");
  $("#lb-close").focus();
});
$("#lb-close").addEventListener("click", () => lb.close());
$("#lb-prev").addEventListener("click", () => step(-1));
$("#lb-next").addEventListener("click", () => step(1));
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
let swiped = false;
lb.addEventListener("click", e => { if (swiped) { swiped = false; return; } if (e.target === lb || e.target.id === "lb-stage") lb.close(); });
let sx = null;
lb.addEventListener("pointerdown", e => { sx = e.clientX; });
lb.addEventListener("pointerup", e => { if (sx !== null && Math.abs(e.clientX - sx) > 50 && GROUPS[cur.g].ids.length > 1) { swiped = true; step(e.clientX < sx ? 1 : -1); } sx = null; });
</script>
</body>
</html>
