<style>
/* Layout: a press sheet. A CMYK color bar and crop marks frame a typographic masthead; each section is coded by the ink plates it would print on (C, M, Y, K and two overprints). Work sits in justified rows on a neutral mat. */
:root {
  --paper: #f5f6f3;
  --paper-2: #eceeea;
  --mat: #e6e9e6;
  --ink: #15171a;
  --ink-2: #4d545a;
  --rule: #d2d6d6;
  --accent: #b8005f;
  --c: #00a0dc;
  --m: #e3007b;
  --y: #ffde00;
  --k: #15171a;
  --my: #e8262d;
  --cy: #00a05a;
  --cm: #2e3192;
  --lb-bg: #0d0e10;
  --lb-ink: #eef0ec;
  --lb-ink-2: #a9b0b5;
  --display: "Roboto", "Helvetica Neue", Arial, sans-serif;
  --name: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --label: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111315; --paper-2: #181b1e; --mat: #1d2024; --ink: #eef0ec; --ink-2: #a9b0b5;
    --rule: #2b3035; --accent: #ff5cb1; --k: #2a2e33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111315; --paper-2: #181b1e; --mat: #1d2024; --ink: #eef0ec; --ink-2: #a9b0b5;
  --rule: #2b3035; --accent: #ff5cb1; --k: #2a2e33; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.6;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1280px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 14px; z-index: 50; font-family: var(--label); }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }

/* type */
.label { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .01em; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--display); }
.display { font-family: var(--display); font-weight: 700; line-height: 1.02; letter-spacing: -.02em; overflow-wrap: break-word; }
/* headings are set in Roboto, in sentence case */
.name { font-family: var(--display); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
p { margin: 0; }
.measure { max-width: 64ch; }

/* plate chips */
.chip { display: inline-flex; align-items: center; gap: 8px; }
.chip i { display: inline-flex; }
.chip i b { width: 13px; height: 13px; border-radius: 50%; display: block; box-shadow: 0 0 0 1px var(--rule); }
.chip i b + b { margin-left: -5px; mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip i b + b { mix-blend-mode: normal; } }
:root[data-theme="dark"] .chip i b + b { mix-blend-mode: normal; }
.p-c { background: var(--c); } .p-m { background: var(--m); } .p-y { background: var(--y); } .p-k { background: var(--k); }

/* header */
.colorbar { display: grid; grid-template-columns: repeat(4, 1fr); height: 6px; }
.colorbar span:nth-child(1) { background: var(--c); } .colorbar span:nth-child(2) { background: var(--m); }
.colorbar span:nth-child(3) { background: var(--y); } .colorbar span:nth-child(4) { background: #15171a; }
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 12px; }
.brand { font-family: var(--name); font-weight: 700; font-size: 22px; text-transform: none; letter-spacing: -.01em; text-decoration: none; line-height: 1; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.nav { overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav ul { list-style: none; display: flex; gap: 22px; margin: 0; padding: 4px 2px; }
.nav a { font-family: var(--label); font-weight: 600; font-size: 14.5px; letter-spacing: .01em; text-decoration: none; color: var(--ink-2); white-space: nowrap; padding-block: 6px; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; }
.nav a:hover { color: var(--ink); border-bottom-color: var(--plate, var(--ink)); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--plate, var(--ink)); }
@media (max-width: 1260px) {
  .head-row { flex-direction: column; align-items: stretch; gap: 6px; padding-block: 10px 4px; }
  .nav ul { gap: 18px; }
}

/* hero */
.hero { padding-block: 56px 48px; }
.sheet { position: relative; padding: 28px 30px 30px; }
.sheet .cm { position: absolute; width: 22px; height: 22px; border-color: var(--ink-2); border-style: solid; border-width: 0; }
.sheet .cm.tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.sheet .cm.tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.sheet .cm.bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.sheet .cm.br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
.hero h1 { font-size: clamp(64px, 12.5vw, 184px); margin-top: 14px; }
.hero h1 .ov { color: var(--m); mix-blend-mode: multiply; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 56px; margin-top: 34px; align-items: start; }
.lede { font-size: clamp(20px, 2.1vw, 25px); line-height: 1.4; }
.hero-note { color: var(--ink-2); font-size: 16.5px; }
.slug { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 26px; color: var(--ink-2); font-family: var(--label); font-size: 14px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .hero { padding-block: 32px 28px; } .sheet { padding: 20px 18px 22px; } .hero-grid { grid-template-columns: 1fr; gap: 18px; margin-top: 22px; } }

/* section bands */
.band { padding-block: 40px 56px; border-top: 1px solid var(--rule); }
.band-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.band-head h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.015em; font-size: clamp(30px, 3.8vw, 46px); line-height: 1.08; }
.band-head .label { color: var(--ink-2); }

/* index cards */
.index { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 26px; }
@media (max-width: 960px) { .index { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .index { grid-template-columns: 1fr; } }
.icard { display: flex; flex-direction: column; gap: 12px; text-decoration: none; min-width: 0; }
.icard .frame { aspect-ratio: 4 / 3; overflow: hidden; background: var(--mat); position: relative; }
.icard .frame img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.icard:hover .frame img { transform: scale(1.035); }
.icard .frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--plate, var(--ink)); }
.icard .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.icard h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: 26px; line-height: 1.12; }
.icard .count { font-family: var(--label); font-weight: 500; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icard p { color: var(--ink-2); font-size: 16px; line-height: 1.5; }

/* case cards */
.cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 26px; }
@media (max-width: 960px) { .cases { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cases { grid-template-columns: 1fr; } }
.ccard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; min-width: 0; }
.ccard .frame { aspect-ratio: 16 / 10; overflow: hidden; background: var(--mat); }
.ccard .frame img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.ccard:hover .frame img { transform: scale(1.035); }
.ccard .kicker { color: var(--ink-2); }
.ccard h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: 23px; line-height: 1.15; }
.ccard p { color: var(--ink-2); font-size: 15.5px; line-height: 1.5; }
.ccard .frame.type { display: flex; flex-direction: column; justify-content: space-between; padding: 18px 20px; background: var(--c); color: #0b1b24; }
.ccard .frame.type strong { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 7vw, 92px); line-height: .9; }
.ccard .frame.type span { font-family: var(--label); font-weight: 600; letter-spacing: .01em; font-size: 14px; }
.ext::after { content: " \2197"; }

/* section page */
.page-head { padding-block: 44px 30px; }
.page-head .eyebrow { display: flex; gap: 14px; align-items: center; color: var(--ink-2); }
.page-head h1 { font-size: clamp(40px, 8vw, 112px); margin-top: 12px; }
.page-head .intro { margin-top: 22px; font-size: 19px; line-height: 1.55; display: grid; gap: 14px; }
.group { padding-block: 34px 18px; border-top: 1px solid var(--rule); }
.group-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.group-head h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: clamp(24px, 2.7vw, 32px); line-height: 1.15; }
.group-head .label { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.proj { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px 40px; padding: 28px 0 30px; border-top: 1px solid var(--rule); align-items: start; }
.group-head + .proj { border-top: 0; padding-top: 4px; }
.proj .kind { color: var(--ink-2); }
.proj h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: 24px; line-height: 1.15; margin: 6px 0 12px; }
.proj .desc { display: grid; gap: 10px; font-size: 16.5px; line-height: 1.55; }
.proj .credit { margin-top: 14px; font-family: var(--label); font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
.proj .jgrid { --row: 190px; }
.vid { margin: 0 0 16px; }
.vid video { display: block; width: 100%; height: auto; background: #000; }
.vtext { margin: 10px 0 0; }
.vtext summary { width: fit-content; cursor: pointer; font-family: var(--label); font-weight: 600; font-size: 15px; letter-spacing: .005em; color: var(--ink); padding: 4px 0; }
.vtext summary:hover { color: var(--accent); }
.vtext-body { max-width: 68ch; padding: 6px 0 4px; font-family: var(--body); font-size: 16px; line-height: 1.55; color: var(--ink); }
.vtext-body p { margin: 0 0 10px; }
.vtext-body .tnote { color: var(--ink-2); font-style: italic; }
video::cue { font-family: Arial, Helvetica, sans-serif; background: rgba(0, 0, 0, .8); color: #fff; }
.vid.tall video { width: auto; max-width: 100%; max-height: 620px; }
.vid figcaption { margin-top: 6px; color: var(--ink-2); }
.jrow > .vid { flex: var(--ar) 1 0; min-width: 0; margin: 0; }
.jrow > .vid video, .jrow > .vid.tall video { width: 100%; max-width: 100%; max-height: none; }
.intro-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; align-items: start; }
.intro-fig { margin: 4px 0 0; }
.intro-fig img { display: block; width: 100%; height: auto; background: #fff; }
.intro-fig figcaption { margin-top: 7px; }
@media (max-width: 900px) { .intro-row { grid-template-columns: minmax(0, 1fr); row-gap: 24px; } }
.csec .vid { grid-column: 1 / -1; max-width: 860px; margin-top: 8px; }
/* every image sits on white */
.tile, .about-grid figure img { background: #fff; }
.proj.noimg { grid-template-columns: minmax(0, 1fr); }
.proj.noimg .proj-text { max-width: 70ch; }
@media (max-width: 900px) { .proj { grid-template-columns: 1fr; } }
/* pixel mark */
.hero .sheet { overflow: hidden; }
.pix { position: absolute; top: 28px; right: 30px; width: clamp(200px, 24vw, 300px); height: auto; display: block; border: 1px solid var(--rule); image-rendering: pixelated; }
.pix .cur { animation: blink 1s steps(1) 3; } /* three blinks, then the cursor stays on; stops after 3 seconds */
@keyframes blink { 50% { opacity: 0; } }
/* the pixel mark stands in for the name on the home page, as wide as the lede column */
.hero-mark { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 56px; margin: 18px 0 0; }
.hero-mark .pix { position: static; width: 100%; margin: 0; grid-column: 1; }
@media (max-width: 760px) { .hero-mark { grid-template-columns: 1fr; margin-top: 14px; } }
@media (prefers-reduced-motion: reduce) { .pix .cur { animation: none; } }
@media (max-width: 760px) { .pix { position: static; width: 220px; margin: 14px 0 4px; } }
/* approach band */
.approach { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 56px; font-size: 18px; line-height: 1.6; }
@media (max-width: 760px) { .approach { grid-template-columns: 1fr; } }

/* looping clips with a pause button */
.loops-wrap { grid-column: 1 / -1; margin-top: 10px; }
.loops-head { display: block; color: var(--ink-2); margin: 10px 0 14px; }
.loops { display: grid; gap: 34px 30px; margin-bottom: 18px; }
.loops.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.loops.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.loop { margin: 0; }
.loop-media { position: relative; }
.loop-media video { display: block; width: 100%; height: auto; }
.loop-btn { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(17, 17, 17, .78); color: #fff; font: 600 14.5px var(--label); cursor: pointer; }
.loop-btn:hover { background: #111; }
.loop-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 6px #111; }
.loop .loop-btn { position: static; margin-top: 10px; min-height: 40px; background: var(--ink); }
.loop .loop-btn:hover { background: #000; }
.loop figcaption { margin-top: 12px; }
.loop .kind { color: var(--ink-2); }
.loop h3, .loop h4 { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: 0; }
.csec .vpair { grid-column: 1 / -1; display: flex; gap: 30px; align-items: flex-start; margin-top: 8px; }
.csec .vpair .vid { flex: 1.7778 1 0; min-width: 0; max-width: none; margin: 0; }
.csec .vpair .jgrid { flex: .75 1 0; min-width: 0; display: block; margin: 0; }
.csec .vpair .jgrid::after { display: none; }
.csec .vpair .jitem { width: 100%; }
.csec .vpair .vid figcaption { margin-top: 7px; color: var(--ink); }
@media (max-width: 600px) { .csec .vpair { flex-direction: column; gap: 22px; } .csec .vpair .vid, .csec .vpair .jgrid { flex: none; width: 100%; } }
.proj-media.full .jgrid { display: block; }
.proj-media.full .jgrid::after { display: none; }
.proj-media.full .jitem { width: 100%; }
.jrows { display: grid; gap: 22px; }
.codefig { margin: 18px 0 0; }
.codefig pre { margin: 6px 0 0; padding: 12px 14px; background: #fff; border: 1px solid var(--rule); overflow-x: auto; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
.codefig code { font: inherit; }
.sketch { margin: 22px 0 0; }
.sketch canvas { display: block; width: 100%; max-width: 640px; height: auto; aspect-ratio: 4 / 3; background: #fff; border: 1px solid var(--rule); touch-action: none; cursor: crosshair; }
.sketch figcaption { margin-top: 7px; }
.sketch-clear { display: inline-flex; align-items: center; min-height: 40px; margin-top: 10px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 14.5px var(--label); cursor: pointer; }
.jrow { display: flex; gap: 14px; align-items: flex-start; }
.jrow .jitem { flex: var(--ar) 1 0; min-width: 0; }
@media (max-width: 600px) { .proj .jrow { gap: 10px; } }
.jrow > .jitem:only-child { flex-grow: max(1, var(--ar)); }
.proj-side { margin-top: 20px; }
.sr-fig { margin-top: 20px; }
/* loops inside a project block: full width under the media and text, one frame shape */
.proj.has-loops > .loops-wrap { margin-top: 18px; padding-top: 22px; border-top: 1px solid var(--rule); }
.proj .loop-media video { aspect-ratio: 3 / 2; object-fit: cover; background: #fff; }
.loop h5 { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: 0; }
@media (min-width: 901px) {
  .proj.side-rows { align-items: stretch; }
  .proj.side-rows > .proj-media, .proj.side-rows > .proj-media > .jrows, .proj.side-rows > .proj-text { display: contents; }
  .proj.side-rows > .proj-media .jrow { grid-column: 1; }
  .proj.side-rows > .proj-media .jrow:nth-child(1), .proj.side-rows .sr-cell:nth-child(1) { grid-row: 1; }
  .proj.side-rows > .proj-media .jrow:nth-child(2), .proj.side-rows .sr-cell:nth-child(2) { grid-row: 2; }
  .proj.side-rows > .proj-media .jrow:nth-child(3), .proj.side-rows .sr-cell:nth-child(3) { grid-row: 3; }
  .proj.side-rows > .proj-media .jrow:nth-child(4), .proj.side-rows .sr-cell:nth-child(4) { grid-row: 4; }
  .proj.side-rows .sr-cell { grid-column: 2; display: flex; flex-direction: column; max-width: 70ch; }
  .proj.side-rows .sr-fig { flex: 1 1 0; min-height: 60px; container-type: size; display: flex; flex-direction: column; justify-content: flex-end; }
  .proj.side-rows .sr-cell:not(:first-child) .sr-fig { margin-top: 0; }
  .proj.side-rows .sr-fig .jrows { width: min(100%, calc((100cqh - var(--fixed)) / var(--inv))); }
}
/* A project with images in its text column: the column fills the row, and its images sit at the bottom,
   sized so their bottom edge (and caption) lines up with the last image in the media column. */
@media (min-width: 901px) {
  .proj.has-side { align-items: stretch; }
  .proj.has-side .proj-text { display: flex; flex-direction: column; }
  .proj.has-side .proj-side { flex: 1 1 0; min-height: 170px; container-type: size; display: flex; flex-direction: column; justify-content: flex-end; }
  .proj.has-side .proj-side .jrows { width: min(100%, calc((100cqh - var(--fixed)) / var(--inv))); }
}
.csec .jrows { grid-column: 1 / -1; display: grid; gap: 26px; margin-top: 8px; }
.csec .jrow { display: flex; gap: 30px; align-items: flex-start; }
.csec .jrow .jitem { flex: var(--ar) 1 0; min-width: 0; }
@media (max-width: 600px) { .csec .jrow { flex-direction: column; gap: 26px; } .csec .jrow .jitem { flex: none; width: 100%; } }
.csec.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 30px; }

.csec .loops-head { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .01em; line-height: 1.4; }
.loop p { color: var(--ink-2); font-size: 15.5px; line-height: 1.55; }

","alt":"A person in a VR headset reaches out with a controller while a laptop shows the virtual room, with the caption Research, Working through grief"},"gv-interview":{"w":1600,"h":900,"title":"Game Design program video","cap":"Still from the Grand View University video on the program.","alt":"Cyndi Wiley laughing during an interview, seated in front of a bookshelf"},"gv-classroom":{"w":1600,"h":900,"title":"Studio classroom","cap":"Walking through a class at work on iMacs. Still from the program video.","alt":"Cyndi Wiley walking past students who work at iMac computers in a studio classroom"},"gv-teaching":{"w":1600,"h":831,"title":"Working with a student","cap":"Talking through a project with a student. Still from the program video.","alt":"Cyndi Wiley standing beside a seated student who gestures toward his computer screen"},"g-catscan":{"w":1600,"h":2161,"title":"Cat Scan","cap":"My cat Chicken, scanned as she walked across the scanner glass. Winner, *Creative Quarterly* 56.","alt":"Distorted scan of a pale cat stretched into streaks on a black ground, with a large yellow shape at the top"},"g-ebm":{"w":1400,"h":2529,"title":"Early Black Metal","cap":"Transparency project, manipulated in Photoshop.","alt":"Collage poster in pink, yellow and black with a vintage illustration of a woman holding a coffee cup and the words It will make you pee, Lip-smacking flavor and early black metal"},"g-gvposter-front":{"w":700,"h":819,"title":"Poster front","cap":"No matter which path you choose, find your place in the world of art and design.","alt":"Blue poster held up by two hands, with the headline No Matter Which Path You Choose, photos of students and a list of art and design majors"},"g-gvposter-back":{"w":700,"h":819,"title":"Poster back","cap":"Careers in art with starting salaries, next to descriptions of each major.","alt":"Back of the poster held up by two hands, with the headline Your Future in the World of Art and Design, a table of art careers and salaries, and photos of campus galleries"},"g-gvmag-drawing":{"w":1600,"h":1591,"title":"p5.js drawing","cap":"The drawing before the masthead was added, with lines of the sketch inside it.","alt":"Black and white drawing of stacked rings that form a large S inside a circle, with lines of p5.js code in blue, green and pink across the lower left"},"w-egg":{"w":532,"h":397,"title":"Egg","cap":"A single egg under one soft light.","alt":"3D rendering of a white egg standing on a gray ground with a soft blue shadow"},"w-egg-pyramid":{"w":640,"h":400,"title":"Egg pyramid","cap":"Three eggs stacked into a small pyramid.","alt":"3D rendering of three white eggs stacked in a pyramid on a dark gray ground with a long shadow"},"w-3d-tower":{"w":543,"h":568,"title":"Tower piece","cap":"A castle tower piece with a notched top.","alt":"Gray 3D model of a castle tower piece with a notched top on a black background"},"w-3d-lamp":{"w":1063,"h":698,"title":"Desk lamp","cap":"A desk lamp with a coiled neck.","alt":"Gray 3D model of a desk lamp with a coiled spring neck and a round base on a black background"},"w-3d-house":{"w":888,"h":695,"title":"House","cap":"A house with gabled roofs.","alt":"Gray 3D model of a two-story house with gabled roofs, a small window and a door on a black background"},"w-3d-dolphin":{"w":1191,"h":694,"title":"Dolphin","cap":"A dolphin in midswim.","alt":"Gray 3D model of a dolphin on a black background"},"w-3d-robot":{"w":1033,"h":694,"title":"Robot","cap":"The robot in plain shading.","alt":"Gray and mauve 3D model of a jointed robot with a periscope head on a black background"},"w-3d-robot-fire":{"w":1093,"h":700,"title":"Robot with texture","cap":"The same robot with a fiery surface texture.","alt":"The jointed robot model covered in an orange and black mottled texture on a black background"},"w-3d-head":{"w":479,"h":694,"title":"Character head","cap":"A character head with a high ponytail.","alt":"3D model of a woman's head with pale skin, green eyes, purple lips const SECTIONS = [
  { id: "ux", name: "UX / UI", plates: ["c"], cover: "isu-prairie1", color: "var(--c)", caseRows: true,
    blurb: "Case studies, app and web design, and information architecture, grounded in research with the people who use them.",
    intro: [
      "My UX practice began during graduate study in human computer interaction at Iowa State University, which included research work with the Design Information Research Group. Each project starts with people. Interviews, card sorts and paper prototypes come before any final screen design, and user testing shapes each revision.",
      "Work from these projects was published and presented at HCI International, IASDR and AECT. Later I applied the same methods to digital accessibility at Iowa State University, including interviews, diary studies and usability testing with students who use assistive technology.",
      "I also work alongside agencies. On the Iowa State University website and its web theme, I joined a cross-campus team that worked with idfive, and my part covered digital accessibility and user testing with prospective students."
    ],
    cases: ["idf", "isu"],
    stance: {"title": "Lived experience is expertise", "proof": [["7.8%", "Unemployment rate for working-age Iowans with disabilities. For Iowans without a disability, the rate was 2.8%."], ["8.3%", "Unemployment rate for people with a disability in the United States, about double the 4.1% rate for people without one."], ["30%", "Share of U.S. workers with a disability who usually work part time. About 17% of workers without a disability do."], ["3%", "Share of the U.S. STEM workforce with a disability, at a time when 9% of the population reported one."]], "note": "Iowa figures cover ages 18 to 64 and come from the American Community Survey. The other figures come from the federal sources listed below.", "cols": [["Disabled people as paid experts", [0, 1, 2]], ["Mutual empathy in research", [3, 4, 5]]], "p": ["The gap holds for college graduates. People with a disability and a bachelor’s degree had an unemployment rate of 5.3%, compared with 2.5% for graduates without a disability. Many disabled workers are also underemployed. In science and engineering-related jobs, part-time workers with a disability wanted full-time work at about twice the rate of other part-time workers, 28% compared with 15%.", "UX research can widen this gap. Teams often ask disabled people to test products for free or for a gift card, while the designers and researchers in the room are paid. A request to an accessibility office for “a few students with disabilities” treats people as test material. Disabled people know assistive technology, and they know where products fail, because they meet those barriers every day. That knowledge is expertise. When abled designers use people only for their disability and keep the pay and the credit, that is ableism.", "I hire people with lived experience as paid experts. At the Digital Accessibility Lab at Iowa State University, students with disabilities trained as testers through the lab and earned the same rate as student web developers. Their findings shaped the audits in the Iowa State website case study above. I presented this model in a talk titled “Testing Online Course Materials: Hiring Students with Disabilities” at the AHEAD Spring Colloquium.", "Stella Young described a related harm in her TED talk, “I’m Not Your Inspiration, Thank You Very Much.” She called it inspiration porn: images and stories that present disabled people as objects of inspiration for nondisabled audiences. Design work does this as well. A product video or case study may feature a disabled user to move its audience and omit what that person knows.", "Many designers and UX researchers learn empathy through Design Thinking, where it is the first stage of a set process. In that version, the designer observes users and then leaves to design for them, so power stays with the designer. Some teams add disability simulations, such as blindfolds. Bennett and Rosner argue that these empathy exercises can keep disabled people at a distance from the design process they were meant to join.", "My research uses Relational Cultural Theory (RCT), developed by Jean Baker Miller and her colleagues at the Stone Center at Wellesley College. In RCT, empathy is mutual, and both people grow through the relationship. Power is shared, which RCT calls “power with,” in place of “power over.” My MFA thesis brought RCT into interaction design through e-CAT, a framework of empathy, connectivity, authenticity and trust. In practice, I design with people. People with lived experience help set the research questions and judge the results, and they are paid and credited for that work."], "sources": [["Institute on Disability, University of New Hampshire. *Annual Disability Statistics Compendium*, Section 3: Employment. Unemployment rates for Iowa, ages 18 to 64.", "https://www.researchondisability.org/resource/2026-disability-statistics-compendium-adsc/section-3-employment-compendium-2026"], ["U.S. Bureau of Labor Statistics. “People with a Disability: Labor Force Characteristics.” Annual news release.", "https://www.bls.gov/news.release/disabl.nr0.htm"], ["National Center for Science and Engineering Statistics. *Diversity and STEM: Women, Minorities, and Persons with Disabilities*. National Science Foundation.", "https://ncses.nsf.gov/pubs/nsf23315/assets/report/nsf23315-report.pdf"], ["Young, Stella. “I’m Not Your Inspiration, Thank You Very Much.” TEDxSydney talk.", "https://www.ted.com/talks/stella_young_i_m_not_your_inspiration_thank_you_very_much"], ["Bennett, Cynthia L., and Daniela K. Rosner. “The Promise of Empathy: Design, Disability, and Knowing the ‘Other.’” *Proceedings of the CHI Conference on Human Factors in Computing Systems*.", null], ["Wiley, Cyndi. “Empathy, Connectivity, Authenticity, and Trust (e-CAT): A Rhetorical Framework for Creating and Evaluating Interaction Design.” MFA thesis, Iowa State University.", "https://lib.dr.iastate.edu/etd/12708/"]]},
    groups: [
      { title: "Research methods", ids: ["ux-sort1", "ux-sort2", "ux-sort3"],
        p: ["These projects combine qualitative and quantitative methods. The focus is sociotechnical research, which studies people and technology together in the places where they live and work."],
        methods: [
          { h: "Discovery and generative research", sub: "Exploring needs and ideas", items: [
            ["User interviews", "One-on-one conversations about motivations, pain points and workflows."],
            ["Field studies and contextual inquiry", "Observation of people in the settings where they work or live."],
            ["Diary studies", "Participants record behaviors or feelings over several days or weeks."],
            ["Surveys and focus groups", "Broad feedback on attitudes and priorities, gathered from individuals or from groups."] ] },
          { h: "Information architecture and design", sub: "Organizing content and flows", items: [
            ["Card sorting", "Participants group topics to show how they expect content to be organized."],
            ["Tree testing", "A text-only hierarchy tests whether people can find what they need."],
            ["Journey maps and personas", "Journey maps trace a user's steps over time. Personas summarize the key user groups."] ] },
          { h: "Evaluation and testing", sub: "Checking usability and performance", items: [
            ["Usability testing", "Moderated and unmoderated sessions in which people complete tasks on a prototype or a live product."],
            ["Heuristic evaluation and cognitive walkthroughs", "Expert reviews against usability principles and step-by-step task flows, used to catch problems early."],
            ["Concept and five-second tests", "Early checks of a product idea and of first impressions."],
            ["A/B testing and analytics", "Comparisons of live variants and behavioral measures collected at scale."] ] }
        ] },
      { title: "Learning research", projects: [
        { kind: "Research // Graphic manuals", title: "The Graphic Manual", ids: [], rows: [["gm-cover", "gm-p2", "gm-p3"], ["gm-p4", "gm-p5", "gm-p6"]], desc: ["My dissertation research created software and technology tutorials in graphic novel format, which I call graphic manuals. The study compared three ways of learning software: a textbook, online video and the graphic manual.", "It was an IRB-approved research study, reviewed as exempt research by the Institutional Review Boards at Iowa State University and Grand View University. In six focus groups, 41 students learned to make an animated GIF in Photoshop, and each group worked with two of the methods. The pages shown here come from the graphic manual for that task.", "The results ran counter to current pedagogy in graphic design. Students trusted the graphic manual much less than the textbook, yet their learning outcomes improved. Online video showed the least progress toward learning outcomes, although it is the model that classrooms and online courses rely on most for teaching technology.", "I have presented the graphic manual research at several national conferences, and I have more chapters written and drawn. My next question is whether integrated development environments support learning better than streaming video does."] }
      ] },
      { title: "Digital publication", projects: [
        { kind: "Interaction design // App design", title: "MO: A Digital Publication", video: "w-mo", note: "Video, 1 minute 24 seconds, quiet screen recording", ids: [], rows: [["w-mo1", "w-mo2"], ["mo-flow1", "mo-flow2"]], credit: "With Mary Jones // Funded by the Iowa Arts Council", desc: ["*MO* was a digital publication about Iowans who use technology in their creative work. Working with Mary Jones, I created the publication as a web app that readers downloaded from the MOIowa.com website.", "It was planned as a short-term, one-of-a-kind project with limited availability after its launch, and it has since been retired. The Iowa Arts Council funded the project, with artist, printmaker and educator Mary Jones as the grant recipient.", "Two flow charts planned the app. One maps the screens from the cover to each artist's piece, and the other sets out sample pages with notes for the cover, the instructions and the navigation panel."] },
        { kind: "Interaction design // Web design", title: "MO website", ids: [], rows: [["w-moweb-home"], ["mo-art-wiley", "mo-art-ford", "mo-art-braidwood"], ["mo-art-lapole", "mo-art-merrill", "mo-art-jones"]], desc: ["The *MO* website was a companion to the digital publication and gave more information about the project. Its Artists page introduced the six artists in the publication, each with an image from their work. The site has since been retired."] }
      ] },
      { title: "App design", projects: [
        { kind: "Interaction design // App design", title: "Shopping Cart Interactive Program (SCIP)", ids: [], rows: [["w-scip1", "scip-splash"], ["w-scip3", "scip-early", "scip-users"]], credit: "Principal investigator: Cyndi Wiley, with Stefan Tauber and Emmanuel Saka // HCI International and IASDR", desc: ["The Shopping Cart Interactive Program (SCIP) was designed to improve shoppers' connection with the grocery store. Nutrition is central to human life, and eating the right foods can change a person's quality of life. SCIP shows readable health information on a mobile device and adapts to each shopper's dietary restrictions, so a trip for groceries becomes less frustrating.", "The project evaluated user interaction and interfaces through a range of methods and applied graphic design knowledge to improve the experience. It built an understanding of the cognitive and perceptual constraints that affect interface design, of techniques for evaluating that design, and of reporting results in speech and in writing.", "The lower row shows process work: an earlier prototype of the scan result screen and a summary of the participants in the user study.", "Papers were published at the HCI International conference in Orlando, Florida, and at the International Association of Societies of Design Research conference in Delft, the Netherlands."] },
        { kind: "Interaction design // App design", title: "The Lavender Garden: A Common Ground Experience", ids: [], rows: [["w-cg-poster"], ["w-cg-logo", "w-cg3"], ["w-cg-home", "w-cg2", "w-cg4"]], credit: "Principal investigator: Cyndi Wiley, with Lei Zhang, Yun Wang and Wei Wang // AECT, Louisville, Kentucky", desc: ["The Lavender Garden app is part of the Common Ground Experience. It links each user's virtual garden to a plot in a real community garden in Ames, Iowa, to support new social ties for older adults.", "The research included distilling complex information for visual presentation. The work was presented at the Association for Educational Communications and Technology (AECT) conference in Louisville, Kentucky."] }
      ] }
    ] },
  { id: "game-design", name: "Game Design", plates: ["y"], cover: "xr-bb-back", casesTitle: "Projects", color: "var(--y)",
    blurb: "Accessible games, from virtual reality prototypes to mobile and Flash games.",
    intro: [
      "My game design work centers on accessibility. The XR Brain Jam, a Games for Change event, pairs researchers with XR developers and digital creatives, and each team builds a working prototype in a few days.",
      "Two earlier games came from graduate study at Iowa State University. Happy Trails guides people with early onset dementia home on foot, and Monkey Pants helps young children on the autism spectrum play with their siblings.",
      "I co-created the Game Design and Interactive Analytics major at Grand View University, and I teach game design today."
    ],
    groups: [
      { title: "Projects", projects: [
        { kind: "Game design // Accessible VR card game", title: "Breaking Bread", yt: {"id": "gys_spw0NSk", "poster": "xr-bb-video"}, note: "Video on YouTube, 1 minute 6 seconds", ids: [], credit: "Team 8, Rye of the Storm: Game Designer, Producer, Developer and UX Research (my role) // Unreal Engine and HTC Vive", desc: ["An accessible virtual reality card game that our team built in three days at the XR Brain Jam, a Games for Change event in New York. My role began in accessibility research. It grew to include game design and graphic design, and I also worked on the UX/UI.", "Breaking Bread is a version of Spades in which four kinds of bread replace the usual suits, and bagels are trump. Play takes place in a coffee shop called The Coffee Bakery, where the player picks up a hand of cards at the counter and carries it back to the table.", "We set accessibility as a requirement from the first day. Players can move any command to any available input, and game elements keep high color contrast against their backgrounds. Each suit also has its own shape, so a player can tell the suits apart without relying on color."] },
        { kind: "Game design // VR experience", title: "The End", yt: {"id": "rROmGGYuhuQ", "poster": "xr-end-video"}, note: "Video on YouTube, 1 minute 40 seconds", ids: [], credit: "A team of four // XR Brain Jam, Games for Change, The New School, New York", desc: ["A virtual reality experience with rooms named for stages of grief, built by a team of four at the XR Brain Jam, a Games for Change event at The New School in New York.", "Rooms such as Anger and Bargaining each hold a key and a door. The team built the experience in Unity and Blender, and it ran on an Oculus Rift S connected to a laptop."] }
      ] },
      { title: "Serious games", projects: [
        { kind: "Game design // Serious games", title: "Monkey Pants", video: "w-mp", note: "Video, 4 minutes 3 seconds, with sound and closed captions", ids: ["w-mp1"], full: true, credit: "With Yun Wang // Poster presented at Ignite Ames", desc: ["This game was designed for young children with autism spectrum disorders (ASD) to play with their siblings. Flapjack the monkey needs to get dressed for school but cannot find his clothes, so he checks with his brother Tiger and his sisters Lion and Bear.", "The learning objectives are asking permission, taking turns, getting dressed and finding hidden things. The game was designed and developed in Adobe Animate, formerly Flash, with ActionScript 3.0."] },
        { kind: "Game design // Serious games", title: "Happy Trails", ids: [], rows: [["ht-goals"], ["ht-banner"]], credit: "With Mikako Matsunaga, Jade Larson and Yun Wang", desc: ["This mobile game was designed for people who experience early onset dementia. The app would run on a phone with GPS location and emergency services.", "Its main function was to map a route to the player's home while the player was out walking, with augmented reality (AR) guides that make familiar places easier to recognize. It was designed and developed in Adobe Animate, formerly Flash, with ActionScript 3.0."] }
      ] }
    ] },
  { id: "motion", name: "Motion Graphics", plates: ["m"], cover: "w-bff-title", color: "var(--m)",
    blurb: "Kinetic typography and hand-drawn 2D animation.",
    intro: [
      "This section collects motion graphics, from kinetic type that opens an interactive history app to hand-drawn animation built in Flash.",
      "Some pieces began as class projects in typography and animation. Art + Design = BFFs accompanied a conference presentation with Rachel Merrill."
    ],
    groups: [
      { title: "Kinetic typography", projects: [
        { kind: "Motion graphics // Kinetic typography", title: "Opening titles for Creating the People's College", video: "isu-anim-titles", note: "Animation, 15 seconds, no sound", ids: [], caseLink: "isu", desc: ["Kinetic type opens an interactive history app for Iowa State University Extension and Outreach. The words build one phrase at a time over archival photographs in a red duotone.", "The case study under UX / UI adds the title screen loop and recordings of the app in use."] },
        { kind: "Motion graphics // Kinetic typography", title: "Gentle Doctor Brown", video: "w-gdb", note: "Video, 3 minutes 13 seconds, with sound", ids: [], credit: "Music: “East St. Louis Toodle-Oo,” Duke Ellington and his Kentucky Club Orchestra", desc: ["A kinetic typography project for a graduate studio class, based on a nonsense poem titled “Gentle Doctor Brown.”", "I used a stop-motion technique, combining JPG images in iMovie with sound."] }
      ] },
      { title: "Video and 2D animation", projects: [
        { kind: "Motion graphics // Video and 2D animation", title: "Art + Design = BFFs", video: "w-bff", note: "Video, 4 minutes 47 seconds, with sound and closed captions", ids: [], credit: "Co-presenter: Rachel Merrill // Popular Culture Association conference, Seattle", desc: ["This motion graphic accompanied the presentation “Art + Design = BFFs (Best Friends Forever), or Queering the Pedagogical Framework for Interdisciplinarity between Art and Design.” It was created in After Effects and Premiere Pro, and it covers the first phase of the work.", "Rachel Merrill and I developed Art + Design = BFFs as a pedagogical model for art and design students. BFF began as a colloquial term for very close friends, and we appropriated it to queer conventional art and design pedagogy.", "Art and design are often conflated, yet in practice they are taught in separate courses. In our model, art and design faculty work together across a student's full course of study. We team teach, share technology, critique together and evaluate student outcomes together, so students meet differing viewpoints and critical lenses in every class."] },
        { kind: "Motion graphics // 2D animation", title: "Hand-drawn animation", video: "w-farm", note: "Video, 12 seconds, with sound", ids: [], desc: ["Hand-drawn elements make up this short animation, built in Adobe Animate, formerly Flash.", "A storyboard came first. Sounds were then recorded, and the graphics were drawn into Flash with a Wacom tablet."] }
      ] }
    ] },
  { id: "modeling", name: "3D Modeling", plates: ["c", "m"], cover: "w-egg-pyramid", color: "var(--cm)",

        { kind: "3D modeling // Light and shadow", title: "Eggs", ids: [], rows: [["w-egg", "w-egg-pyramid"]], desc: ["Two still lifes of eggs. One egg stands alone, and three more are stacked into a small pyramid.", "Each sits on a plain ground under a soft light that casts a long shadow."] },
        { kind: "3D modeling // Objects", title: "Model studies", ids: [], rows: [["w-3d-tower", "w-3d-lamp"], ["w-3d-house", "w-3d-dolphin"]], desc: ["A set of models rendered in gray on a black background. They range from hard-edged objects, such as a castle tower piece and a house, to the curved forms of a desk lamp's coiled neck and a dolphin."] },
        { kind: "3D modeling // Characters", title: "Characters", ids: [], rows: [["w-3d-robot", "w-3d-robot-fire", "w-3d-head"]], desc: ["A jointed robot appears twice, first in plain shading and then with a fiery surface texture. A character head with a high ponytail completes the set."] }

  { id: "code", name: "Creative Coding", plates: ["k"], cover: "w-glitch", color: "var(--k)",
    blurb: "Interactive and generative work in Processing and p5.js, along with glitch art.",
    intro: [
      "Code is the material in these pieces. A JPG is glitched by hand in a text editor, and a poem responds to the reader's mouse and keyboard.",
      "Code also draws. A magazine cover takes its S from a p5.js drawing."
    ],
    groups: [
      { title: "p5.js", projects: [
        { kind: "Creative code // p5.js", title: "Up Down All Around", ids: [], rows: [["g-gvmag", "g-gvmag-drawing"]], code: "function setup() {\n  createCanvas(640, 480);\n}\n\nfunction draw() {\n  if (mouseIsPressed) {\n    fill(0);\n  } else {\n    fill(255);\n  }\n  ellipse(mouseX, mouseY, 80, 80);\n}", sketch: true, credit: "Cover, *GV* magazine, Grand View University", desc: ["The magazine described this cover as a still image from an interactive coding experiment in p5.js. Readers could open the sketch online and make their own drawing with a mouse or a finger.", "The sketch is a few lines long. On every frame it draws a circle at the pointer, black while the button is held and white once it is released. I drew the S of stacked rings by moving the pointer through the canvas, and lines of the code appear inside the finished art.", "The original page is no longer online, so the same sketch runs again below the images."] }
      ] },
      { title: "Processing", projects: [
        { kind: "Creative code // Processing", title: "She Tasted Like Guava", video: "w-guava", note: "Video, 11 seconds, no sound", ids: [], credit: "Exhibited at the *MO* unveiling, Moberg on Walnut", desc: ["I wrote an autobiographical stream-of-consciousness poem called “She Tasted Like Guava.” I then used Processing, a programming language created for artists and designers, so that readers interact with the piece through mouse movements and keystrokes.", "The video demonstrates some of the interactions."] }
      ] },
      { title: "Glitch art", projects: [
        { kind: "Creative code // Glitch art", title: "Glitched JPG", ids: [], rows: [["w-glitch-orig", "w-glitch-code", "w-glitch"]], desc: ["I glitched a JPG image by opening its code in TextEdit and typing in nonsensical characters."] }
      ] }
    ] },
  { id: "graphic", name: "Graphic Design", plates: ["y"], cover: "g-bessie", color: "var(--y)",

    intro: [
      "I worked as a graphic designer, art director and creative director, mostly in St. Louis. In graduate school at Iowa State University, studio courses turned my attention to typography as a field of research.",

        { kind: "Package design // DVD", title: "The Asphalt Gospel", ids: [], rows: [["g-asphalt-mockup"]], cap: 480, credit: "Designer: Cyndi Wiley // Photographer: Scott Griessel", desc: ["DVD package for The Asphalt Gospel, a documentary by Crosswalk America about six people who set out on a walking journey across the country. I also appear in the film."] }

        { kind: "Advertising // Transparency collage", title: "Early Black Metal", ids: [], rows: [["g-ebm"]], wcap: 480, desc: ["A transparency project made with a Xerox copier and then manipulated in Photoshop. The piece takes the form of a coffee advertisement."] }

      { title: "Identity and type design", projects: [

        { kind: "Identity // Design system", title: "Star Spangled Rodeo", ids: [], rows: [["g-rodeo", "g-rodeo-gallery"], ["g-rodeo-schedule", "g-rodeo-zines", "g-rodeo-covers"]], cap: 480, desc: ["The Star Spangled Rodeo logo uses hand-cut stencil letters, and the same system carries into printed zines. The theme ran through the gallery's exhibit season as well, on the wall and in a fold-out exhibit schedule. The work was recognized at the IDA Design Awards."] },
        { kind: "Type design", title: "Minkzy", ids: [], rows: [["g-minkzy", "g-minkzy-spec"]], cap: 480, desc: ["Minkzy is a display typeface drawn from a tree that stands in the front yard of an old farmhouse. The introductory poster sets the full alphabet against the bark, and the specimen shows the character set at 72 and 36 points."] }

      { title: "Posters", projects: [

  { id: "fine-art", name: "Fine Art", plates: ["m", "y"], cover: "a-qr", color: "var(--my)",
    blurb: "An installation with stitched code and projected type.",
    intro: [
      "My studio work moves between stitched, painted and digital processes, and everyday text appears often.",
      "The installation +w@+ filled a gallery with a QR code mural, projections and type written in code, and I gave an artist talk in the space."
    ],
    groups: [
      { title: "+w@+ = Code Switching", projects: [
        { kind: "Installation // Computational linguistics", title: "+w@+ = Code Switching", ids: [], rows: [["cs-wall"], ["a-wat-room", "cs-room-media"], ["cs-imac-room", "cs-backwall"], ["cs-floor", "a-wat-install", "a-qr"], ["cs-projectors", "a-talk1"]], loops: [["On the TV, the iMac and the back wall", [{"id": "cs-statement", "kind": "Video // TV", "title": "Artist statement", "note": "Video, 3 minutes 24 seconds, no sound", "desc": "The TV played my artist statement under the title of the show. The text scrolls slowly from start to finish."}, {"id": "cs-imac", "kind": "p5.js // iMac", "title": "I must not sit in my office", "note": "Screen recording, 1 minute 15 seconds, no sound", "desc": "A p5.js sketch on the iMac writes lines of my story about disability and the workday. The lines circle and pile up until they become a dense mass of type."}, {"id": "cs-scans", "kind": "Projection // Back wall", "title": "Scanner loop", "note": "Video, 2 minutes 48 seconds, no sound", "desc": "I moved things around on the scanner glass to make abstract images. Code then ran over the scans until the original could no longer be identified."}]], ["Floor projections at the base of the billboard", [{"id": "cs-qr", "kind": "Projection // Floor", "title": "QR codes and drawings", "note": "Video, 1 minute 20 seconds, no sound", "desc": "Each QR code sits beside a pencil drawing and changes with it. The codes hide other parts of the story for anyone who works to decode them."}, {"id": "cs-queer", "kind": "Projection // Floor", "title": "Queer", "note": "Video, 19 seconds, no sound", "desc": "Single words from the story appear one at a time, and lines of code follow them."}, {"id": "cs-leaving", "kind": "Projection // Floor", "title": "Leaving", "note": "Video, 46 seconds, no sound", "desc": "A second sequence of words, which closes with the p5.js code behind the projections."}]]], desc: ["Linguistics is the scientific study of language and its structure. Within this scientific study of language, many variants exist to other areas of phonetics, semantics, applied linguistics, and even computational linguistics. Rules, such as grammar and syntax also apply to this area. Many social theories relating to stylistics and structural linguistics intersect with art theories; all this to say that speech and writing have been studied, and continue to be extensively studied. This work focuses on an area of linguistics referred to as \"code switching.\"", "Code switching is typically when a person alternates between two or more languages (or variants of language) in a single conversation. It can also be a more informal mixture of two languages, such as Spanish and English, often referred to as Spanglish. In the movie *Sorry to Bother You* (2018) characters code switch between African American vernacular and \"white voice\" in order to connect and sell products and services to predominantly white audiences. Code switching is a common survival tool for African Americans and Blacks in the United States. I am not Black or African American or a person of color. I am white. The way in which I code switch is a different tool for navigating very privileged spaces. I recognize some of the privilege and power I carry in being white. It is impossible to fully understand white privilege, and yet we do not talk about it enough as existing and how to break down negative stereotypes.", "I code switch in my everyday interactions between queer communities and straight communities. My colleagues are mostly straight. My family is straight. My friends are a mix of queer and straight. When I'm with my family in southern, rural Missouri, a weird drawl sometimes slips out of me that matches theirs. It's a way to fit in and it's a way to identify. Identity is one reason for code switching. In my small, rural Missouri hometown, Jennifer is known as \"cousin Jenn\". This code switch in identity is for our safety. When we check into the local motel, we do not ask for a room with one king bed. Instead, we have to ask for a room with two double beds to hide our identity. My family has finally accepted cousin Jenn as my married partner of 17 years. However, that small rural Missouri town has an active group of the KKK, and they have made it known that blacks and queers are not welcome. I want to be out and proud of my gay identity. It's not safe in my hometown. People that my family know refer to me as a \"foreigner\" because I have Iowa license plates. My plates were run by the local police when I drove through town because I am not one of them anymore. When Jennifer and I stop at gas stations, we have to hope we will be safe inside. We tend to pick places that have single restrooms, rather than stalls. At one pitstop, we thought a Flying J would be safe for us. I decided to shop for a Diet Coke first before using the restroom. Jennifer walked up to me in a hurry and said a woman was getting her husband to find the guy that was in the women's restroom. I looked over at the woman and her husband that were pointing at us. Not only was I upset that these people wanted to hurt Jennifer for using the restroom, I had to leave behind my Diet Coke.", "All of this experience comes through and comes out in this work. I am using computational linguistics to create and express my identity, switch identity, hide identity, and float between different identities. It's an exploration of my own queer identity, mixed with my identity as a person with a disability. My identity doesn't always fit within the broad identity of the institution in which I work, a predominantly straight, white, middle class, male led institution. Hence, my need to protect myself and code switch.", "Pieces in the show: Large billboard printed with 4 QR codes. On the TV is my artist statement, peppered in with bits of code I used to build the video on the iMac that tells a part of my story. The projectors at the bottom of the billboard are scrolling other parts of my story. I am masking other parts by including a series of QR codes that can be decoded if you work hard enough. On the reverse wall, there is a projector looping a video of a scanner. I experiment a lot with scanning, moving things around on the glass to create abstract images, placing those images in code and letting the code run to further mask them so that you can no longer identify the original scan. This work feels very vulnerable and it feels liberating."] }
      ] }
    ] },
  { id: "teaching", name: "Teaching", plates: ["c", "y"], cover: "t-regatta", introImg: "gv-teaching", color: "var(--cy)",
    blurb: "Student work from my courses at Grand View University and Iowa State University, credited to each student.",
    intro: [
      "I often use references to popular culture, in particular visual culture and rhetoric, in the classroom. They break down typical barriers in academia between students and the topics we approach. I also use a strong sense of play to invite students in as active participants in their learning. The goal is for students to become intrinsically motivated to experiment with risk and failure, so that they use their own agency as creative decision-makers.",
      "I view everyone in higher education as a creative person, whatever the major. All disciplines need creative thinkers, and Design Thinking offers a method for the wicked problems that appear in every field. One of the most persistent of these problems in education is how to truly engage students. We can no longer teach in silos of our disciplines, so I work closely with colleagues across campus to develop pedagogy and share resources.",
      "I began teaching design as an instructor of record for graphic technology courses at Iowa State University. At Grand View University I taught interactive design, digital imaging, app design and game design. I co-created the Game Design and Interactive Analytics program there and also served as Department Chair. I later returned to Iowa State as an Assistant Teaching Professor in human computer interaction. There I taught graduate and undergraduate UX/UI courses, including a fully online graduate course on digital accessibility and inclusive design.",
      "Today I teach asynchronous online courses, including game design, at University of Maryland Global Campus for adult learners and active-duty military learners. The student work below comes from Grand View and Iowa State. Each project appears with the student's first name and last initial."
    ],
    quote: { text: "I believe that students learn best in a collaborative, hands-on environment where free thought and experimentation is encouraged.", cite: "From my teaching philosophy" },
    groups: [
      { title: "Program Development", projects: [
        { kind: "Curriculum // Program development", title: "Game Design and Interactive Analytics", yt: {"id": "7U_g-3d0SPU", "poster": "gv-interview"}, note: "Video on YouTube, 2 minutes 24 seconds", ids: [], rows: [["gv-classroom"]], credit: "Co-creator // Grand View University", desc: ["I co-created the Game Design and Interactive Analytics program at Grand View University.", "In this video from the university, Dr. Josh Call and I explain how the program fits within a liberal arts education. The still below, from the same video, shows a class at work in the studio."] }

      { title: "Game Design", projects: [
        { kind: "Game design // Card games", title: "Art Attack", ids: [], rows: [["t-art-attack"]], credit: "Student: Amanda G. // ARTS 104 Principles of Design II, Grand View University", desc: ["The last project in the Principles of Design II: Digital Media course is game design. Students research a range of games by visiting local stores and playing many games together. They create all of the packaging and design elements and are graded on how well they incorporate game mechanics.", "Project co-written with Rachel Merrill-Schwaller."] },
        { kind: "Game design // 2D 8-bit side-scrolling", title: "Office Race", ids: [], rows: [["t-office-title", "t-office"]], credit: "Student: RJ N. // ARTS 470 Capstone, Grand View University", desc: ["This game was created for the final capstone course. The student used Adobe Animate, then known as Flash, to build a side-scrolling game with a well-known mechanic: the character jumps over obstacles in an office.", "Simple graphics with an 8-bit look keep game play fast on a phone, and the game was fully functional on a mobile device."] }
      ] },

        { kind: "Interaction design // App design", title: "Art department app", ids: [], rows: [["t-artapp1", "t-artapp3", "t-artapp2", "t-artapp4", "t-artapp5"]], credit: "Student: Carolyn P. // ARTS 425 Interactive Design 4, Grand View University", desc: ["The assignment was to build a working app in Adobe Animate for students in the art department at Grand View University. Students researched their classmates' needs, created an information architecture and tested low-fidelity paper prototypes before they made the graphics.", "The apps ran on mobile devices through the Adobe mobile simulator and used ActionScript."] },
        { kind: "Interaction design // App design", title: "Seymour Art app", ids: [], rows: [["t-seymour"]], credit: "Student: Todd N. // ARTS 435 App Design, Grand View University", desc: ["The assignment was to build a working app in Adobe Animate, with ActionScript 3.0, for the Seymour Art student group. Students researched their classmates' needs, created an information architecture and tested low-fidelity paper prototypes before they made the graphics.", "The apps ran on mobile devices through the Adobe mobile simulator. This student chose to keep hand-drawn elements in the design."] }
      ] },
      { title: "Augmented Reality", projects: [
        { kind: "Augmented reality // Museum", title: "Museum AR guide", ids: [], rows: [["t-ar-museum", "t-ar"]], credit: "Student: Justin Y. // ARTS 401 Design 5, Grand View University", desc: ["Students studied contemporary artists and created a gallery guide that helps visitors find an artist's work in a museum of their choosing. Each guide included an augmented reality (AR) component.", "This student's guide combines projection mapping that would work in broad daylight with a mobile app that creates an interaction with the work of Ai Weiwei. The student used the Aurasma app as a simulator.", "Project co-written with Mary Jones."] }
      ] },
      { title: "Digital Imaging", projects: [
        { kind: "Digital imaging // Isometric perspective", title: "Isometric campus map", ids: [], rows: [["t-iso"], ["t-iso-process1", "t-iso-process2", "t-iso-class1", "t-iso-class2"]], credit: "Student: Devin M., with process drawings from the class // ARTS 366 Advanced Digital Imaging, Grand View University", desc: ["The assignment was to create a map of the Grand View University campus in isometric perspective. Students began by walking the campus and photographing its buildings and landscape features. With graph paper, Legos and their photographs, they then drew the map in pencil.", "Once the hand drawing was finished, students recreated the map in Adobe Illustrator. Isometric perspective is common in maps, and it is also used to build game worlds."] },
        { kind: "Digital imaging // Concept art", title: "Game concept art", ids: [], rows: [["t-concept1"], ["t-concept2"]], credit: "Students: Kelsie R. (city street) and Jen B. (tree in water) // ARTS 366 Advanced Digital Imaging, Grand View University", desc: ["Students created concept art for a multi-level game. Each student developed a game concept and painted an environment for one of its levels, using Adobe Photoshop and a Wacom tablet."] },

      { title: "Graphic Design", projects: [
        { kind: "Digital imaging // 2D illustration", title: "Head of the Des Moines Regatta", ids: [], rows: [["t-regatta"]], cap: 781, credit: "Student: Elle L. // ARTS 401 Design 5, Grand View University", desc: ["Students worked with the head of the Des Moines Rowing Club to produce graphics for the club's regatta. This student drew the rowing sculls by hand and then digitized the drawing in Adobe Illustrator.", "The same identity carried over to a t-shirt, a postcard, a program cover and a medal."] },
        { kind: "Graphic design // Identity", title: "Emile Culinary identity", ids: [], rows: [["t-emile1"], ["t-emile2", "t-emile3"], ["t-emile4", "t-emile5"]], grow: ["t-emile1"], credit: "Student work", desc: ["An identity system for Emile Culinary. A red circle mark carries across stationery, a tri-fold brochure, a flyer and a responsive website."] },
        { kind: "Graphic design // Packaging", title: "Numi tea packaging", ids: [], rows: [["t-numi2"], ["t-numi1", "t-numi3"]], grow: ["t-numi2"], credit: "Student work", desc: ["Packaging for Numi organic teas. Tall boxes in green and lavender carry an ornate logo, and the identity uses the tagline become a new you."] },
        { kind: "Graphic design // Hand lettering", title: "Bail Grip Flip", ids: [], rows: [["t-grownup"]], grow: ["t-grownup"], credit: "Student work", desc: ["Hand lettering of the words Bail Grip Flip, set in a circle in blue on an orange ground."] }
      ] },
      { title: "3D Modeling", projects: [
        { kind: "3D modeling // Blender", title: "Blender shark", ids: [], rows: [["t-shark-mesh"], ["t-shark-ref", "t-shark-smooth"], ["t-shark-color", "t-shark"]], grow: ["t-shark-mesh"], credit: "Student: Todd N. // ARTS 375 Interactive Design 3, Grand View University", desc: ["Students worked through a series of self-led tutorials in Blender, the open-source 3D creation program. In this tutorial, students modeled a shark from a simple 2D reference image and recorded major changes to their files in a series of screenshots."] }
      ] },
      { title: "3D Animation", projects: [
        { kind: "Motion graphics // 3D animation", title: "Dead Man Walking response", video: "t-dmw", note: "Video, 17 seconds, with sound", ids: [], credit: "Student: Sam H. // ARTS 375 Interactive Design 3, Grand View University", desc: ["Working with the Des Moines Metro Opera, students created animated responses to the opera Dead Man Walking. They read the libretto, listened to the music and developed their own concepts.", "This student built the piece around a line in the libretto about a jury that took seventeen minutes to decide whether a man should live or die. The animation runs 17 seconds to reflect how little time that decision took."] },
        { kind: "Motion graphics // 3D animation", title: "TV promo", video: "t-tvpromo", note: "Video, 5 seconds, with sound", ids: [], credit: "Student: Judy L. // ARTS 375 Interactive Design 3, Grand View University", desc: ["Students created a five-second 3D animation for a TV network. They modeled type in Blender, animated the spot and added sound to hold the viewer's attention."] },
        { kind: "Motion graphics // 3D animation", title: "Symbol in 3D space", video: "t-morph", note: "Video, 17 seconds, with sound", ids: [], credit: "Student: Alicia H. // 2D and 3D Space: Morphology and Animation, Iowa State University", desc: ["Students take the symbol from their Symbolism and Morphology Study project, export its paths from Illustrator into Cinema 4D and build a 3D symbol. They then create a 3D animation from it.", "The project covers the perceptual qualities of motion, key framing, F-curves and rendering, and the relationship between 2D and 3D space and meaning."] }
      ] },

function tile(id, gkey, idx, opts = {}) {
  const m = IMG[id];
  if (!m) return "";
  const ar = Math.max(m.w / m.h, 0.55).toFixed(4);
  const small = m.w < 900 && m.h < 900 && !(opts.grow && opts.grow.includes(id));
  const lim = small ? ` style="max-width:${m.w}px;max-height:${m.h}px"` : "";
  const sub = SUB[id] ? `<small>${esc(SUB[id])}</small>` : "";
  return `<figure class="jitem" style="--ar:${ar}">
    <button class="tile" type="button" data-g="${gkey}" data-i="${idx}" aria-label="View larger: ${esc(m.title)}">
      <img src="img/t/${id}.webp" alt="${esc(m.alt)}" width="${m.w}" height="${m.h}" loading="${opts.eager ? "eager" : "lazy"}" decoding="async"${lim}>
    </button>
    ${opts.nocap ? "" : `<figcaption class="jcap">${esc(m.title)}${sub}</figcaption>`}
  </figure>`;
}
function rowGrid(rows, opts = {}) {
  const key = "g" + (gseq++);
  GROUPS[key] = { ids: rows.flat().filter(id => id !== "@video"), title: opts.title || "" };
  let i = 0;
  const cap = r => {
    const ms = r.map(id => IMG[id]).filter(Boolean);
    if (opts.wcap) return ` style="max-width:${Math.min(opts.wcap, ms.reduce((n, m) => n + m.w, 0) + 14 * (r.length - 1))}px"`;
    if (!opts.cap) return "";
    const sum = ms.reduce((n, m) => n + Math.max(m.w / m.h, 0.55), 0);
    const h = Math.min(opts.cap, ...ms.map(m => m.h));
    return ` style="max-width:${Math.round(h * sum + 14 * (r.length - 1))}px"`;
  };
  return `<div class="jrows">${rows.map(r => `<div class="jrow"${cap(r)}>${r.map(id => id === "@video" ? (opts.vid || "") : tile(id, key, i++, opts)).join("")}</div>`).join("")}</div>`;
}
function sideFig(p) {

function sketchFig() {
  return `<figure class="sketch"><canvas class="sketch-canvas" width="640" height="480" role="img" aria-label="Drawing area for the p5.js sketch. Move the pointer to draw white circles, and hold the button or touch to draw black ones."></canvas><figcaption class="jcap">The sketch, running<small>Move over the canvas to draw white circles. Hold the mouse button, or touch and drag, to draw black ones.</small></figcaption><button type="button" class="sketch-clear">Clear the canvas</button></figure>`;
}
function initSketch() {
  document.querySelectorAll(".sketch-canvas").forEach(cv => {
    const ctx = cv.getContext("2d");
    const clear = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); };
    clear();
    let x = null, y = null, down = false;
    const pos = e => { const r = cv.getBoundingClientRect(); x = (e.clientX - r.left) * cv.width / r.width; y = (e.clientY - r.top) * cv.height / r.height; };
    const tick = () => {
      if (!cv.isConnected) return;
      if (x !== null) { ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fillStyle = down ? "#000" : "#fff"; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = "#000"; ctx.stroke(); }
      requestAnimationFrame(tick);
    };
    cv.addEventListener("pointermove", pos);
    cv.addEventListener("pointerdown", e => { down = true; pos(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
    const up = e => { down = false; if (e.pointerType !== "mouse") x = null; };
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    cv.addEventListener("pointerleave", () => { if (!down) x = null; });
    cv.closest(".sketch").querySelector(".sketch-clear").addEventListener("click", clear);
    requestAnimationFrame(tick);
  });
}
function grid(ids, opts = {}) {

  GROUPS[key] = { ids, title: opts.title || "" };

}

function pixelMark() {
  const pad = 3, cells = []; let x = 0;
  for (const ch of "Dr. Wiley") {
    const g = PXF[ch];
    if (!g) { x += 3; continue; }
    g.forEach((row, y) => [...row].forEach((b, i) => { if (b === "1") cells.push([x + i, y]); }));
    x += g[0].length + 1;
  }
  const W = x - 1 + pad * 2 + 3, H = 9 + pad * 2 + 4;
  const sq = (c, dx, dy, fill) => c.map(([a, b]) => `<rect x="${a + pad + dx}" y="${b + pad + dy}" width="1" height="1" fill="${fill}"/>`).join("");
  const bar = ["#00a0dc", "#e3007b", "#ffde00", "#f5f6f3"].map((f, k) => `<rect x="${pad + k * 3}" y="${pad + 11}" width="2" height="2" fill="${f}"/>`).join("");
  return `<svg class="pix" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><rect width="${W}" height="${H}" fill="#15171a"/>${sq(cells, 0.4, 0.4, "#e3007b")}${sq(cells, 0, 0, "#f5f6f3")}<rect class="cur" x="${x + pad}" y="${pad + 5}" width="2" height="2" fill="#ffde00"/>${bar}</svg>`;
}

function playLoop(v) { if (v.preload === "none") v.preload = "auto"; const p = v.play(); if (p && p.catch) p.catch(() => setLoopBtn(v)); }
function setLoopBtn(v) {
  const b = v.parentNode.querySelector(".loop-btn"); if (!b) return;
  const on = !v.paused;
  b.setAttribute("aria-label", (on ? "Pause " : "Play ") + v.dataset.title);
  b.innerHTML = on ? '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg><span>Pause</span>'
    : '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg><span>Play</span>';
}
function initLoops() {
  if (loopObs) { loopObs.disconnect(); loopObs = null; }
  const vids = document.querySelectorAll("video[data-loop]");
  if (!vids.length) return;
  if ("IntersectionObserver" in window) loopObs = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting && e.intersectionRatio >= .5) { if (!v.dataset.held) playLoop(v); }
    else if (!v.paused) v.pause();
  }), { threshold: [0, .5] });
  vids.forEach(v => {
    if (reduce || !v.hasAttribute("data-autoplay")) v.dataset.held = "1";
    v.addEventListener("play", () => setLoopBtn(v));
    v.addEventListener("pause", () => setLoopBtn(v));
    v.parentNode.querySelector(".loop-btn").addEventListener("click", () => {
      if (v.paused) { delete v.dataset.held; playLoop(v); } else { v.dataset.held = "1"; v.pause(); }
    });
    setLoopBtn(v);
    if (loopObs) loopObs.observe(v); else if (!reduce) playLoop(v);
  });
}
